# AQIDA_CONSTITUTIONAL_SCOPE: gate | CLAIM_BOUNDARY: release packaging of already recorded results; states nothing new | FALSIFICATION_TESTS: lake build, check_axioms.sh, verify_certificates.py
#
# NOT EXECUTED: this workflow was written on the authoring machine and has never been run, on GitHub
# or elsewhere. Its first run is the first clean-machine build of the Lean files.
#
# Plain shell steps are used for Lean. The action `leanprover/lean-action@v1` (with
# `lake-package-directory: lean`) is the intended alternative; it is not used here because its input
# names were not checked against its documentation.

name: lean_verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib cache
        working-directory: lean
        run: lake exe cache get

      - name: Build TheoremL and TheoremL_LayerRanks
        working-directory: lean
        run: lake build

      - name: Axiom check (main files and negative control)
        working-directory: lean
        run: bash check_axioms.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the seven certificates
        run: python certificates/verify_certificates.py
